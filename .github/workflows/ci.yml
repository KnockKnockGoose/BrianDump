name: CI

# Docs-only changes skip CI. plugin/commands/*.md is not in this list on purpose: the plugin validator reads it.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CODE_OF_CONDUCT.md
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CODE_OF_CONDUCT.md
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Pinned to the version the code was linted with, so a new ruff release cannot turn CI red overnight.
      - name: Install ruff
        run: python -m pip install ruff==0.17.1

      # Blocking. Settings are in pyproject.toml ([tool.ruff]). No format check: the code is formatted by hand in a
      # compact 140-column style, which a formatter would rewrite.
      - name: Lint
        run: python -m ruff check --output-format=github .

  test:
    name: test / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # The oldest Python the README promises and the one it was tested with.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # No faster-whisper, no model and no microphone in CI: the tests use fakes.
      # sounddevice and pynput need a sound and display stack on Linux, so Ubuntu gets numpy only;
      # the tests that need them skip there.
      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-dev.txt numpy sounddevice pynput

      - name: Install (Ubuntu)
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements-dev.txt numpy

      # The page test drives Chromium through Playwright and needs `playwright install chromium`;
      # it runs locally, not in CI.
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q tests --ignore=tests/test_panel_page.py

      # Tests marked win32 (console, window and hotkey APIs) are deselected on Ubuntu.
      - name: Tests (Ubuntu)
        if: runner.os != 'Windows'
        run: python -m pytest -q tests -m "not win32" --ignore=tests/test_panel_page.py

  plugin:
    name: plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned to the version the README says BrianDump was tested with; bump both together.
      # No login is needed to validate a plugin or a marketplace file.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: Validate the plugin (plugin/.claude-plugin/plugin.json, hooks, commands)
        run: claude plugin validate --strict ./plugin

      - name: Validate the marketplace (.claude-plugin/marketplace.json)
        run: claude plugin validate --strict .
